<!DOCTYPE html>
<html>

<head>
    <title>About wnr</title>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimal-ui" />
    <!-- solve the electron-jquery conflict, style changed due to a vscode problem -->
    <script>
        window.$ = require("jquery/dist/jquery.slim.min.js");
    </script>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="res/fonts/iconfont.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <script src="supporter.js"></script>
    <script src="updater.js"></script>
    <div class="d-flex mx-auto text-dark" id="about">
        <div id="controller">
            <a href="javascript:window.close()" class="small rest"><i class="iconfont icon-close"
                                                                      id="close"></i></a>
            <script>
                $('#close').attr('title', i18n.__('close'));
                if (process.platform === "darwin") $("#controller").css("display", "none");
            </script>
        </div>
        <main class="about-card" id="about-content">
            <img class="about-mark" src="res/icons/wnrIcon.png" alt="" />
            <h1 class="about-name">wnr</h1>
            <p class="about-version">
                <script>document.write(i18n.__('version') + require("./package.json").version);</script>
            </p>
            <a href="javascript:updateChecker(2)" class="btn btn-sm btn-outline-primary">
                <span id="manually"><script>document.write(i18n.__('manually-check-for-update'));</script></span>
            </a>
            <nav class="about-links">
                <a href="javascript:require('electron').shell.openExternal(require('./package.json').homepage)">
                    <script>document.write(i18n.__('homepage'));</script>
                </a>
                <a href="javascript:require('electron').shell.openExternal('https://github.com/RoderickQiu/wnr/')">
                    <script>document.write(i18n.__('on-github'));</script>
                </a>
                <a href="mailto:scrisqiu@hotmail.com">
                    <script>document.write(i18n.__('email-to'));</script>
                </a>
            </nav>
            <p class="about-legal">
                &copy; <a href="javascript:require('electron').shell.openExternal('https://r-q.name')">Roderick Qiu</a>
                and contributors. Licensed under
                <a href="javascript:require('electron').shell.openExternal('https://github.com/RoderickQiu/wnr/blob/master/LICENSE')">MPL 2.0</a>;
                see <a href="javascript:require('electron').shell.openExternal('https://github.com/RoderickQiu/wnr/blob/master/NOTICE.md')">NOTICE.md</a>
                for dependencies' licenses.
            </p>
        </main>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
