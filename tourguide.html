<!DOCTYPE html>
<html>

<head>
    <title>wnr</title>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimal-ui" />
    <script>
        window.$ = require("jquery/dist/jquery.slim.min.js");
    </script>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="res/fonts/iconfont.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <script src="supporter.js"></script>
    <main id="tourguide">
        <img class="tour-mark" src="res/icons/wnrIcon.png" alt="" />
        <h1 class="tour-title" id="title">
            <script>document.write(i18n.__('tourguide-welcome'))</script>
        </h1>
        <p class="tour-subtitle" id="subtitle">
            <script>document.write(i18n.__('tourguide-your-software'))</script>
        </p>
        <!-- the app's own dial, drawn once as the window opens -->
        <div class="tour-dial" aria-hidden="true">
            <svg viewBox="0 0 100 100">
                <circle class="dial-track" cx="50" cy="50" r="46"></circle>
                <circle class="dial-progress tour-dial-arc" cx="50" cy="50" r="46" pathLength="100"></circle>
            </svg>
            <span class="tour-dial-time">25:00</span>
        </div>
        <dl class="tour-features">
            <script>
                // each line reads "Label: description"; show the label on its own line
                [1, 2, 3, 4].forEach(function (n) {
                    const line = i18n.__('tourguide-' + n);
                    const split = line.search(/[:：]/);
                    const term = split > 0 ? line.slice(0, split) : '';
                    const desc = split > 0 ? line.slice(split + 1).trim() : line;
                    document.write('<div class="tour-feature">' + (term ? '<dt>' + term + '</dt>' : '') + '<dd>' + desc + '</dd></div>');
                });
            </script>
        </dl>
        <a id="tourguide-close" href="javascript:window.close()" class="btn btn-solid tour-start">
            <script>document.write(i18n.__('tourguide-finish'))</script>
        </a>
        <script>
            $('#tourguide-close').attr('title', i18n.__('tourguide-finish-tip'));
        </script>
    </main>
    <script src="renderer.js"></script>
</body>

</html>
